services:
  - type: web
    name: adez-smm
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /smm-api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: APP_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
